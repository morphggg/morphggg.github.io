<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Группы ОК</title>
    <link rel="stylesheet" href="css/style.css?v=395">
    <link rel="stylesheet" href="css/ok-groups.css?v=90">
</head>
<body>
<div id="zoomFrame">
    <header class="topbar">
        <nav class="main-nav" aria-label="Главное меню">
            <a class="nav-link" href="#" data-tab="ads">
                <i class="icon icon-ads"></i>
                <span class="nav-text">ОБЪЯВЛЕНИЯ</span>
            </a>
            <a class="nav-link" href="#" data-tab="letters">
                <i class="icon icon-letters"></i>
                <span class="nav-text">ОБЪЯВЛЕНИЯ СКОМПОНОВАННЫЕ</span>
            </a>
            <a class="nav-link" href="#" data-tab="import">
                <i class="icon icon-import"></i>
                <span class="nav-text">ИМПОРТ ИЗ XML ФАЙЛА</span>
            </a>
            <a class="nav-link active" href="#" data-tab="companies">
                <i class="icon icon-companies"></i>
                <span class="nav-text">СООБЩЕСТВА</span>
            </a>
            <a class="nav-link" href="#" data-tab="resume">
                <i class="icon icon-resume"></i>
                <span class="nav-text">ПОДПИСЧИКИ</span>
            </a>
            <a class="nav-link" href="#" data-tab="managers">
                <i class="icon icon-managers"></i>
                <span class="nav-text">ИНТЕРФЕЙС</span>
            </a>
        </nav>
    </header>

<main class="page">
    <div class="page-inner">
        <div class="mode-row" id="modeRow" role="radiogroup" aria-label="Режим публикации" hidden>
            <label class="mode-option">
                <input type="radio" name="publishMode" value="auto" class="mode-input" checked>
                <span class="mode-dot" aria-hidden="true"></span>
                <span class="mode-text">Автоматическая публикация и депубликация объявлений</span>
            </label>
            <label class="mode-option">
                <input type="radio" name="publishMode" value="manual" class="mode-input">
                <span class="mode-dot" aria-hidden="true"></span>
                <span class="mode-text">Ручная публикация и депубликация объявлений</span>
            </label>
        </div>
        <button type="button" class="add-group-btn" id="addGroupBtn">Добавить группу в ОК</button>
        <div class="groups-list" id="groupsList"></div>
    </div>
</main>

<template id="groupTemplate">
    <section class="group-card" data-group>
        <header class="group-head">
            <span class="group-title">Группа в ОК <span data-group-number>№1</span>:</span>
            <a class="group-link" href="#" target="_blank" rel="noopener" data-group-link>—</a>
            <span class="group-altname" data-group-altname></span>
            <div class="group-actions">
                <button type="button" class="g-icon-btn act-toggle" data-action="toggle" aria-expanded="false" aria-label="Развернуть данные"><i class="g-vi-arrow" aria-hidden="true"></i></button>
                <button type="button" class="g-icon-btn act-remove" data-action="remove" aria-label="Удалить группу"><i class="g-vi-xcircle" aria-hidden="true"></i><span class="g-tooltip" role="tooltip">Удалить группу</span></button>
                <button type="button" class="g-icon-btn act-edit" data-action="edit" aria-label="Редактировать группу"><i class="g-vi-edit" aria-hidden="true"></i></button>
            </div>
        </header>
        <dl class="group-details" data-group-details hidden>
            <div class="g-field"><dt>Ключ:</dt><dd data-field="key"></dd></div>
            <div class="g-field"><dt>Id приложения:</dt><dd data-field="appId"></dd></div>
            <div class="g-field"><dt>Id группы:</dt><dd data-field="groupId"></dd></div>
            <div class="g-field"><dt>Пароль:</dt><dd data-field="password"></dd></div>
            <div class="g-field g-field-login"><dt>Логин:</dt><dd data-field="login"></dd></div>
        </dl>
        <div class="group-main">
            <div class="group-left">
                <div class="group-tags">
                    <button type="button" class="tag tag-y"><i class="vi-tag vi-publish" aria-hidden="true"></i>Публиковать</button>
                    <button type="button" class="tag tag-b-light">Остановить</button>
                    <button type="button" class="tag tag-y"><i class="vi-tag vi-unpublish" aria-hidden="true"></i>Депубликовать</button>
                    <button type="button" class="tag tag-b">Запустить</button>
                    <button type="button" class="tag tag-y"><i class="vi-tag vi-subs" aria-hidden="true"></i>Парсинг подписчиков</button>
                    <button type="button" class="tag tag-b-light">Остановить</button>
                    <button type="button" class="tag tag-y"><i class="vi-tag vi-unpublish-all" aria-hidden="true"></i>Все Депубликовать</button>
                    <button type="button" class="tag tag-b tag-shift">Остановить</button>
                </div>
                <div class="group-checks">
                    <div class="checks-col">
                        <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Через какое время публиковать новый пост на канале, минут <input type="text" class="inline-num" data-numeric maxlength="4" value="10"></span></label>
                        <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Заменить email для объявлений тип "Газета" на <input type="text" class="inline-email" data-email value="vvnsa@mail.ru"></span></label>
                        <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Режим объединений объявлений по названию вакансии.</span></label>
                        <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Режим объединений объявлений по номеру счета</span></label>
                        <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Не публиковать названия компаний</span></label>
                        <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">У зарплата руб./мес если сумма менее 50000руб. менять на текст "По договоренности"</span></label>
                        <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Без <DOPINFORMSOBYAZANOSTI> <DOPINFORMSTREBOVANIY> <DOPINFORMSUSLOVIY></span></label>
                        <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Без адреса</span></label>
                        <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Без email</span></label>
                    </div>
                    <div class="checks-col">
                        <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Публиковать с картинками</span></label>
                        <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Публиковать с эмодзи</span></label>
                    </div>
                </div>
            </div>
            <div class="group-right">
                <div class="r-field">
                    <div class="r-label">Прописать путь к файлу xlsx, который нужно загрузить в сообщество</div>
                    <div class="file-field" data-file="upload">
                        <div class="file-input-wrap">
                            <input type="text" class="file-input" readonly>
                            <button type="button" class="file-clear" data-clear aria-label="Очистить поле" hidden></button>
                        </div>
                        <div class="paperclip-wrap">
                            <button type="button" class="paperclip" data-pick aria-label="Выбрать файл xlsx"><i class="vi vi-paperclip" aria-hidden="true"></i></button>
                            <span class="tooltip" role="tooltip">Пропишите путь к файлу, после этого, его название попадет в поле</span>
                        </div>
                        <input type="file" class="hidden-file" accept=".xlsx,.xls" hidden>
                    </div>
                </div>
                <input type="text" class="qty-input" data-qty placeholder="Количество вакансий XX" readonly>
                <div class="checks-col checks-col-right">
                    <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Не указывать телефон в картинке</span></label>
                    <label class="chk"><input type="checkbox"><span class="chk-box"></span><span class="chk-text">Выводить номер счета</span></label>
                </div>
                <div class="r-field">
                    <div class="r-label">Прописать путь к файлу xlsx, путь к картинкам по названию вакансии</div>
                    <div class="file-field file-field-browse" data-file="images">
                        <div class="file-input-wrap">
                            <input type="text" class="file-input" readonly>
                            <button type="button" class="file-clear" data-clear aria-label="Очистить поле" hidden></button>
                        </div>
                        <button type="button" class="browse-btn" data-pick>Обзор</button>
                        <input type="file" class="hidden-file" accept=".xlsx,.xls" hidden>
                    </div>
                </div>
                <div class="r-field">
                    <div class="r-label">Текст под названием вакансии в картинке</div>
                    <textarea class="img-caption" rows="2"></textarea>
                </div>
            </div>
        </div>
    </section>
</template>

<div class="modal-overlay" id="groupModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle">
        <div class="modal-head">
            <h2 class="modal-title" id="groupModalTitle">Добавить группу в ОК</h2>
            <button type="button" class="modal-close" id="groupModalClose" aria-label="Закрыть"><i class="vi vi-clear" aria-hidden="true"></i></button>
        </div>
        <form class="modal-body" id="groupForm">
            <div class="modal-yellow">
                <div class="modal-hint">
                    <span class="hint-bulb" aria-hidden="true"></span>Необходимо заполнить поля
                </div>
                <div class="modal-fields" id="modalFields"></div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn-add" id="groupSubmit" disabled>Добавить</button>
                <button type="button" class="btn-cancel" id="groupCancel">Отменить</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="confirmModal" hidden>
    <div class="modal modal-confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal-head">
            <h2 class="modal-title" id="confirmTitle">Удалить группу?</h2>
            <button type="button" class="modal-close" id="confirmModalClose" aria-label="Закрыть"><i class="vi vi-clear" aria-hidden="true"></i></button>
        </div>
        <div class="modal-body">
            <p class="confirm-text" id="confirmText">Группа будет удалена безвозвратно. Продолжить?</p>
            <div class="modal-footer">
                <button type="button" class="btn-add btn-add-active" id="confirmYes">Удалить</button>
                <button type="button" class="btn-cancel" id="confirmNo">Отменить</button>
            </div>
        </div>
    </div>
</div>

<script src="js/script.js?v=311"></script>
<script src="js/ok-groups.js?v=20"></script>
</body>
</html>
